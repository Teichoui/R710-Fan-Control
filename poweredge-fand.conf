#!/usr/bin/perl

# Configuration for Tei's Dell PowerEdge R720xd, TrueNAS SCALE, bare metal.
#
# Hardware this file assumes (re-check with `sensors -j`, `lsblk -S`,
# and `nvidia-smi` if anything is swapped):
#   - 2x Xeon E5-2620 (coretemp-isa-0000 / coretemp-isa-0001)
#   - Tesla P100 16GB   at PCI 42:00.0 (passive - relies entirely on
#     chassis airflow; slows at 82C, shuts down at 85C)
#   - Quadro P1000      at PCI 43:00.0 (has its own fan, targets 82C
#     by design, so it runs hot *normally*)
#   - LSI HBA in IT mode; 12x 3.5" front bays (tank pool) + 2x 2.5"
#     rear flex bays (boot-pool: FIKWOT 128GB SSD mirror), all
#     reporting through the kernel drivetemp driver in lm-sensors -
#     no hddtemp, no MegaCli on this box
#   - NVMe SSD (nvme-apps pool) at PCI 04:00.0 (nvme-pci-0400)
#   - 6 chassis fans, ~17000 RPM at 100%

$static_speed_low=0x02;
$static_speed_high=0x12;   # scaling factor: the raw speed at 100%
                           # "demand"; demand is allowed to keep
                           # climbing past 100% up to a raw speed of
                           # 100 (0x64) if things get really hot

$ipmi_inlet_sensorname  ="Inlet Temp";   # verified via
$ipmi_exhaust_sensorname="Exhaust Temp"; # `ipmitool sdr type temperature`

$default_exhaust_threshold=60; # Above this exhaust temp, give control
                               # back to iDRAC.  This box idles at
                               # ~46C exhaust (two warm GPUs), so
                               # upstream's 50 would trip constantly;
                               # 60 here means "something is genuinely
                               # wrong" (Dell rates 12G exhaust to
                               # ~70C)

$base_temp     = 26;       # No fan demand below this weighted temp
$desired_temp1 = 36;       # Aim to keep the weighted temperature below this
$desired_temp2 = 44;       # Really ramp up fans above this
$desired_temp3 = 50;       # Very steep ramp above this
$demand1       = 5;        # Prescaled demand at temp1
$demand2       = 40;       # Prescaled demand at temp2
$demand3       = 400;      # Prescaled demand at temp3.  400 => a
                           # weighted temp of 50C drives the raw fan
                           # speed to ~0x42 (66%).  Upstream used 200
                           # (34%) but this chassis has tight intake
                           # airflow and a passive Tesla, so the top
                           # end errs toward more cooling: one genuine
                           # 50C HDD pulls roughly two-thirds speed,
                           # loud but not the full jet-engine 100%

$hysteresis    = 2;        # Don't chase fan changes smaller than this
                           # once settled; always allow ramping down

# One child daemon per fan, individually controllable (0 = Fan1
# leftmost viewed from the front ... 5 = Fan6).  If per-fan IPMI
# control turns out not to work on this iDRAC firmware, change to:
# @daemons=(0xff);
@daemons=qw(0 1 2 3 4 5);

# Front drives report via the kernel drivetemp driver, named by SCSI
# target: target 9 -> "drivetemp-scsi-0-90" (hex of target*16).
# Returns undef harmlessly if a drive is missing/asleep - average()
# and max() both skip undefs.
sub drive_temp {
  my ($target) = (@_);
  return $sensors_ref->{"drivetemp-scsi-0-" . sprintf("%x", $target << 4)}{"temp1"}{"temp1_input"};
}

sub custom_temperature_calculation {
  # ---- Front 12x LFF bays: 3 rows of 4 columns ----------------------
  # SCSI targets enumerate in expander phy order (verified against
  # lsblk HCTL + /dev/disk/by-path):
  #   phys 2-9   = targets 0-7   = front slots 0-7
  #   phys 12-15 = targets 10-13 = front slots 8-11
  #   phys 10,11 = targets 8,9   = rear flex bay SSDs (boot-pool)
  # Dell numbers front LFF slots 0-3 top row, 4-7 middle, 8-11 bottom,
  # left to right viewed from the front.  Each column of 3 drives sits
  # in front of roughly 1.5 fans.
  # NOTE: column<->slot mapping is from phy order and is the standard
  # wiring, but hasn't been LED-verified yet.  To verify:
  #   dd if=/dev/disk/by-path/pci-...-phyN-lun-0 of=/dev/null bs=1M count=2000
  # and watch which bay's activity LED blinks.
  my $col0_drives = average(drive_temp(0), drive_temp(4), drive_temp(10)); # leftmost: sda,sdg,sdk
  my $col1_drives = average(drive_temp(1), drive_temp(5), drive_temp(11)); #           sdb,sde,sdl
  my $col2_drives = average(drive_temp(2), drive_temp(6), drive_temp(12)); #           sdd,sdh,sdm
  my $col3_drives = average(drive_temp(3), drive_temp(7), drive_temp(13)); # rightmost: sdc,sdi,sdn

  # Hottest single drive per column: used below so that one genuinely
  # hot HDD escalates its own fan zone directly instead of being
  # diluted by its cool neighbours in the averages.
  my $col0_max = max(drive_temp(0), drive_temp(4), drive_temp(10));
  my $col1_max = max(drive_temp(1), drive_temp(5), drive_temp(11));
  my $col2_max = max(drive_temp(2), drive_temp(6), drive_temp(12));
  my $col3_max = max(drive_temp(3), drive_temp(7), drive_temp(13));

  # ---- Rear 2.5" flex bays: boot-pool SSD mirror ---------------------
  # These live in *exhaust* air above the PSUs.  They read ~54C when
  # exhaust is 46C - only ~8C above the air that cools them - so
  # chassis fans have very little authority over them and they can
  # never be cooled below exhaust temperature.  The -15 offset lets
  # them add demand if they get genuinely hot (65C+) without pegging
  # the fans forever chasing an impossible setpoint.
  my $rear_ssds = average(drive_temp(8), drive_temp(9)); # sdf,sdj

  # ---- CPUs ----------------------------------------------------------
  my $cpu0 = $sensors_ref->{"coretemp-isa-0000"}{"Package id 0"}{"temp1_input"};
  my $cpu1 = $sensors_ref->{"coretemp-isa-0001"}{"Package id 1"}{"temp1_input"};

  # ---- GPUs (via nvidia-smi, see nvidia_gpu_temp in the daemon) ------
  # P100: passive, the whole reason this daemon exists.  Normal 45-60,
  # concern at 75, slows at 82.  Offset -10 and double weight: idle it
  # contributes gently, but by 75-80C it dominates its fan zones.
  # Quadro P1000: self-cooled, designed to sit near 82C, so offset it
  # -20 so its "normal hot" doesn't spin the chassis fans; it still
  # adds demand if it heads toward its own 90C+ concern zone.
  my $p100   = nvidia_gpu_temp("42:00.0");
  my $quadro = nvidia_gpu_temp("43:00.0");

  # ---- NVMe (apps pool) ----------------------------------------------
  # Composite idles ~52C, crit 88C.  Offset -10 keeps it a modest
  # contributor unless it genuinely heats up.
  my $nvme = $sensors_ref->{"nvme-pci-0400"}{"Composite"}{"temp1_input"};

  if (print_stats_once()) {
    my $p100_str   = defined $p100   ? $p100   : "undef";
    my $quadro_str = defined $quadro ? $quadro : "undef";
    print "p100=$p100_str, quadro=$quadro_str, cpus=$cpu0, $cpu1, nvme=$nvme\n";
    print "drives = col0=$col0_drives, col1=$col1_drives, col2=$col2_drives, col3=$col3_drives ; rear_ssds=$rear_ssds\n";
  }

  # ---- Fan zone weighting ---------------------------------------------
  # Drives count 3x (they're the things we can't replace easily and
  # they don't throttle themselves); CPUs throttle safely so weight 1.
  # GPU and NVMe placement below assumes the GPUs exhaust through the
  # right-hand fan zones (both cards hang off CPU2's PCIe root, bus
  # 42/43) and the NVMe rides a left/centre riser (bus 04, CPU1) -
  # refine after the load test by ramping individual fans and watching
  # which temperature responds (upstream's technique).
  # The max() against the column's hottest drive means one 50C HDD
  # pulls its own zone to ~66% regardless of how cool its neighbours
  # are.  The rear SSDs are deliberately NOT part of any max() - see
  # above, the fans can't win that fight.
  my @fan_weighted_temp;
  $fan_weighted_temp[0] = max(weighted_average(3,$col0_drives, 1,offset($rear_ssds,-15)),
                              $col0_max);
  $fan_weighted_temp[1] = max(weighted_average(3,average($col0_drives,$col1_drives), 1,offset($rear_ssds,-15), 1,offset($nvme,-10)),
                              $col0_max, $col1_max);
  $fan_weighted_temp[2] = max(weighted_average(3,$col1_drives, 1,$cpu0, 1,offset($nvme,-10)),
                              $col1_max);
  $fan_weighted_temp[3] = max(weighted_average(3,$col2_drives, 1,$cpu1, 2,offset($p100,-10)),
                              $col2_max);
  $fan_weighted_temp[4] = max(weighted_average(3,$col3_drives, 2,offset($p100,-10), 1,offset($quadro,-20)),
                              $col3_max);
  $fan_weighted_temp[5] = max(weighted_average(3,$col3_drives, 1,offset($p100,-10), 1,offset($quadro,-20)),
                              $col3_max);

  return $fan_weighted_temp[$fans];
}

1;
