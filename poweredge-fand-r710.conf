#!/usr/bin/perl

# Configuration for Tei's Dell PowerEdge R710, bare-metal Proxmox VE
# (Debian 13/trixie, kernel 7.0.12-1-pve).
#
# Hardware this file assumes (re-check with `sensors -j` and
# `ipmitool sdr elist all` if anything is swapped):
#   - 2x dual-core Xeon E5503 (coretemp-isa-0000 / coretemp-isa-0001,
#     reported as "Core 0"/"Core 2" - this CPU/kernel combo doesn't
#     expose a "Package id" sensor like the newer Xeons on the R720xd)
#   - No GPU, no add-in PCIe cards besides NICs (onboard Matrox VGA
#     only) - lspci confirmed
#   - The SAS2008 HBA and all its drives are PCI-passthrough'd to a
#     guest VM (truenas-710) - the host itself has NO data drives,
#     only its own boot SSD (kernel drivetemp, "drivetemp-scsi-0-0")
#   - 5 chassis fans (not 6 like the R720xd/R730xd)
#   - No iDRAC6 Enterprise card ("iDRAC6 Ent Pres: Absent"), so the
#     IPMI SDR only exposes one working temperature sensor - "Ambient
#     Temp" - every "Inlet"/"Exhaust"/"Planar"/"CPU Temp Interf"
#     reading is "Disabled".  This matches the upstream readme's own
#     warning for the R710: you'll likely need to repoint the
#     inlet/exhaust regexes at whatever your board actually reports.

$static_speed_low=0x02;
$static_speed_high=0x12;   # scaling factor: the raw speed at 100%
                           # "demand"; demand is allowed to keep
                           # climbing past 100% up to a raw speed of
                           # 100 (0x64) if things get really hot

# Only one working IPMI temperature sensor on this board - point both
# names at it.  ambient_temp() is stats-only (not used in the fan
# weighting below); exhaust_temp() is the hard failsafe check in the
# daemon's main loop, so this is what actually protects the machine
# if the sensors/CPU-temp path ever breaks.
$ipmi_inlet_sensorname  ="Ambient Temp";
$ipmi_exhaust_sensorname="Ambient Temp";

$default_exhaust_threshold=35; # Above this ambient reading, give
                               # control back to iDRAC.  Idles at 22C;
                               # 35 is a genuine "something's wrong
                               # with the room" cutoff (upstream's own
                               # comment elsewhere puts an un-air-
                               # conditioned closet ceiling around 32)

$base_temp     = 26;       # No fan demand below this weighted temp
$desired_temp1 = 36;       # Aim to keep the weighted temperature below this
$desired_temp2 = 44;       # Really ramp up fans above this
$desired_temp3 = 50;       # Very steep ramp above this
$demand1       = 5;        # Prescaled demand at temp1
$demand2       = 40;       # Prescaled demand at temp2
$demand3       = 200;      # Prescaled demand at temp3 -> ~34% at 50C.
                           # Unlike the R720xd there's no passive GPU
                           # or dense drive bay to protect here, just
                           # two low-TDP dual-core CPUs, so upstream's
                           # original milder ramp is appropriate

$hysteresis    = 2;        # Don't chase fan changes smaller than this
                           # once settled; always allow ramping down

# Single daemon drives all 5 fans together.  There's no spatial
# reason to zone them separately here (no drive bays, no GPUs to
# favour one side of the chassis over another), so all-fans mode -
# @daemons=(0xff) - is simpler and was exactly the mode the 0xff
# indexing fix in custom_temperature_calculation was written for.
@daemons=(0xff);

sub custom_temperature_calculation {
  # E5503 has no package-level sensor, only per-core; average each
  # socket's two cores.
  my $cpu0 = average($sensors_ref->{"coretemp-isa-0000"}{"Core 0"}{"temp2_input"},
                      $sensors_ref->{"coretemp-isa-0000"}{"Core 2"}{"temp4_input"});
  my $cpu1 = average($sensors_ref->{"coretemp-isa-0001"}{"Core 0"}{"temp2_input"},
                      $sensors_ref->{"coretemp-isa-0001"}{"Core 2"}{"temp4_input"});

  # Boot SSD only - not performance critical, idles at ~25C, included
  # as a minor/low-weight contributor just so a genuinely overheating
  # system disk (eg airflow blocked) still nudges the fans.
  my $boot_ssd = $sensors_ref->{"drivetemp-scsi-0-0"}{"temp1"}{"temp1_input"};

  if (print_stats_once()) {
    print "cpus=$cpu0, $cpu1, boot_ssd=$boot_ssd\n";
  }

  # CPUs weighted equally; boot SSD counts for little (it's not a
  # data drive, just along for the ride) but isn't ignored outright.
  return weighted_average(4,$cpu0, 4,$cpu1, 1,$boot_ssd);
}

1;
